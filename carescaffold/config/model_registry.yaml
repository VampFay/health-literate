# ───────────────────────────────────────────────────────────────
# CareScaffold model registry (spec §4.3)
# ───────────────────────────────────────────────────────────────
# All business code reads model identifiers from this file via
# /llm/router.py. NEVER hardcode model strings in service modules.
# Hot-reloadable: /core/config.py re-reads this file when its mtime
# changes, so a model swap is a one-line edit + no restart.

roles:
  generation:
    primary: claude-sonnet-5
    fallback: claude-haiku-4-5-20251001
  safety_judge:
    primary: claude-haiku-4-5-20251001
  embeddings:
    primary: voyage-4-large
    output_dimension: 1024
    # voyage-4-large supports Matryoshka output dims {256, 512, 1024, 2048}.
    # We pin 1024 explicitly via the API `output_dimension` parameter — do NOT
    # rely on a client-library default that may change between releases.

timeouts:
  latency_failover_ms: 2500

retry:
  max_attempts: 2
  on_status: [429, 500, 503]
