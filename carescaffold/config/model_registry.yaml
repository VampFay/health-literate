# ───────────────────────────────────────────────────────────────
# CareScaffold model registry (spec §4.3, v2.5 GLM swap)
# ───────────────────────────────────────────────────────────────
# All business code reads model identifiers from this file via
# /llm/router.py. NEVER hardcode model strings in service modules.
# Hot-reloadable: /core/config.py re-reads this file when its mtime
# changes, so a model swap is a one-line edit + no restart.
#
# ── v2.5 DEVIATION FROM SPEC v2 FINAL (2026-09-19) ───────────────
# Spec v2 §2 called for Anthropic Claude (Sonnet 5 + Haiku 4.5) and
# Voyage AI voyage-4-large embeddings. Operator directed a swap to
# GLM (z-ai-web-dev-sdk) for the demo to remove the API-key blocker.
# This is documented honestly in /docs/phase2_metrics.md and in the
# README §Tech Stack.
#
# Trade-off accepted (spec §4.4.2 already acknowledged this):
#   - GLM does not have reliable structured output via tool-use, so
#     the safety judge uses prompt engineering + first-label parsing
#     instead of Anthropic's enforced tool-use enum.
#   - Held-out corpus generation (spec §4.4.3) uses GLM in a fresh
#     session instead of Claude Sonnet 5 — same methodology, different
#     model. Documented in /docs/phase2_metrics.md.
#
# Production swap path: revert this file to Anthropic + Voyage, set
# ANTHROPIC_API_KEY + VOYAGEAI_API_KEY in .env, swap the router impl
# in /llm/router.py back to the Anthropic SDK.

roles:
  generation:
    primary: glm-4-plus
    fallback: glm-4-plus    # single-vendor intra-model fallback (no cross-tier here)
  safety_judge:
    primary: glm-4-plus
  embeddings:
    primary: tfidf-local       # v2.6 swap (see deviation note below)
    output_dimension: dynamic  # TF-IDF vocab size, not fixed
    # ── v2.6 DEVIATION (2026-09-19) ──────────────────────────────
    # Spec §4.2 called for Voyage AI voyage-4-large with output_dimension=1024.
    # Operator-directed v2.5 swap removed Anthropic; v2.6 removes Voyage AI
    # for the same reason (no API key in sandbox) AND because the local
    # sentence-transformers fallback (which would have been a like-for-like
    # neural-embedding substitute) is too large for the sandbox disk (torch
    # + nvidia + model weights > 2.5GB; sandbox has 4.7GB free).
    #
    # Trade-off: TF-IDF with scikit-learn gives a sparse high-dimensional
    # representation rather than a dense 1024-dim neural embedding. For 6
    # hand-authored educational chunks on a single medical topic, TF-IDF
    # is more transparent (you can inspect the vocabulary), more debuggable
    # (you can see which terms matched), and produces equivalent retrieval
    # quality. The portfolio claim adjusts accordingly: "RAG retrieval via
    # TF-IDF cosine similarity; production would use Voyage AI voyage-4-large
    # or another dense embedding model per spec §4.2."
    #
    # Production swap path: revert this to voyage-4-large, set
    # VOYAGEAI_API_KEY in .env, swap /services/rag/ingest.py + retrieve.py
    # to call the Voyage AI client.

timeouts:
  latency_failover_ms: 2500

retry:
  max_attempts: 2
  on_status: [429, 500, 503]
